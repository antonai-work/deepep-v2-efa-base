name: test-build

# Triggers on any PR and on pushes to main. Builds the image locally on the
# runner (no push) and runs the 5-check preflight harness inside it.
#
# This catches Dockerfile regressions before they hit a tag push, so the
# release tag flow is always hot.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          build-mount-path: /runner-build-space
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Point Docker data-root at the maximized mount
        run: |
          sudo mkdir -p /runner-build-space/docker
          echo '{"data-root":"/runner-build-space/docker"}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info | grep -i 'Docker Root Dir'

      - name: Re-checkout after maximize-build-space
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load canonical pins from pins.env
        # Single source of truth for fork/branch/SHA pins is ./pins.env at the
        # repo root. Wave 7d-1 OKR-1: kills SHA drift across the three
        # consumer repos by making the builder source pins.env and pass the
        # values via --build-arg.
        id: pins
        run: |
          set -euo pipefail
          test -f pins.env || (echo "pins.env missing at repo root" && exit 1)
          # shellcheck disable=SC1091
          . ./pins.env
          echo "DEEPEP_FORK=${DEEPEP_FORK}"         >> "$GITHUB_OUTPUT"
          echo "DEEPEP_BRANCH=${DEEPEP_BRANCH}"     >> "$GITHUB_OUTPUT"
          echo "DEEPEP_SHA=${DEEPEP_SHA}"           >> "$GITHUB_OUTPUT"
          echo "NVIDIA_NCCL_PIN=${NVIDIA_NCCL_PIN}" >> "$GITHUB_OUTPUT"

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: deepep-v2-efa-base:test
          build-args: |
            DEEPEP_FORK=${{ steps.pins.outputs.DEEPEP_FORK }}
            DEEPEP_BRANCH=${{ steps.pins.outputs.DEEPEP_BRANCH }}
            DEEPEP_SHA=${{ steps.pins.outputs.DEEPEP_SHA }}
            NVIDIA_NCCL_PIN=${{ steps.pins.outputs.NVIDIA_NCCL_PIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Run preflight harness inside the image
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/preflight"
          docker run --rm deepep-v2-efa-base:test bash /preflight.sh \
            | tee "${RUNNER_TEMP}/preflight/log"
          tail -n1 "${RUNNER_TEMP}/preflight/log" | grep -E '^5/5 checks PASS$'
