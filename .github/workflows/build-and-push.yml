name: build-and-push

# Triggers on any tag matching v*. The expected first release tag is
# v0.1.0-sm90a. Pushes the built image to GHCR under
# ghcr.io/antonai-work/deepep-v2-efa-base with two tags:
#   :<tag-name>       (e.g. :v0.1.0-sm90a) -- the specific release name
#   :sha-<commit-sha> (short git SHA)      -- immutable reproducibility pin
#
# NOTE: we intentionally do NOT publish a floating alias tag (e.g. an
# unconditional :v0.1.0-sm90a republish on every future v0.1.1 push).
# Downstream consumers that require immutability must pin the
# :sha-<commit-sha> tag or the image digest. See docs/USAGE.md.
# (god-mode F3, fixed 2026-05-05.)
#
# The free Ubuntu runners only have ~14 GB free disk out of ~30 GB total by
# default, which is not enough for a CUDA 12.9 devel image. easimon's
# maximize-build-space action frees up ~45 GB by wiping preinstalled SDKs.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        # Frees ~45 GB on the free runner disk + mounts it at the given path.
        # We point Docker's data-root at a subdir of that mount so buildkit
        # has room for its pulled base image + intermediate layers.
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          build-mount-path: /runner-build-space
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Point Docker data-root at the maximized mount
        run: |
          sudo mkdir -p /runner-build-space/docker
          echo '{"data-root":"/runner-build-space/docker"}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info | grep -i 'Docker Root Dir'

      - name: Re-checkout after maximize-build-space
        # maximize-build-space wipes /home/runner/work to mount the freed
        # partition; we need the repo back.
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: meta
        run: |
          short_sha="$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Load canonical pins from pins.env
        # Single source of truth for fork/branch/SHA pins is ./pins.env at the
        # repo root. This step sources it and emits the values as outputs so
        # the build-push step can pass them via --build-arg, overriding the
        # Dockerfile ARG defaults. Wave 7d-1 OKR-1: kills SHA drift.
        id: pins
        run: |
          set -euo pipefail
          test -f pins.env || (echo "pins.env missing at repo root" && exit 1)
          # shellcheck disable=SC1091
          . ./pins.env
          echo "DEEPEP_FORK=${DEEPEP_FORK}"     >> "$GITHUB_OUTPUT"
          echo "DEEPEP_BRANCH=${DEEPEP_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "DEEPEP_SHA=${DEEPEP_SHA}"       >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/antonai-work/deepep-v2-efa-base:${{ github.ref_name }}
            ghcr.io/antonai-work/deepep-v2-efa-base:sha-${{ steps.meta.outputs.short_sha }}
          build-args: |
            DEEPEP_FORK=${{ steps.pins.outputs.DEEPEP_FORK }}
            DEEPEP_BRANCH=${{ steps.pins.outputs.DEEPEP_BRANCH }}
            DEEPEP_SHA=${{ steps.pins.outputs.DEEPEP_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/antonai-work/deepep-v2-efa-base
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}

      - name: Flip GHCR package visibility to public
        # GitHub's default when publishing a new container package via
        # GITHUB_TOKEN is `private`, even when the source repository is
        # public. This step flips the visibility to `public` so downstream
        # images and humans can `docker pull` without a GHCR login. The
        # PATCH endpoint requires `packages: write` which `permissions:` on
        # this workflow already grants.
        run: |
          curl -fsS -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/antonai-work/packages/container/deepep-v2-efa-base/visibility \
            -d '{"visibility":"public"}' \
          || echo "Visibility PATCH failed - package may still be private; fix manually in the org package settings."
