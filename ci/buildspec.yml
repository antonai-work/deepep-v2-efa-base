version: 0.2

# AWS CodeBuild spec for deepep-v2-efa-base
# Builds the base image, runs preflight, pushes to ECR.
# Environment variables required:
#   AWS_ACCOUNT_ID, AWS_REGION, ECR_REPO (default: deepep-v2-efa-base)
#   BASE_VERSION_TAG (default: v0.1.2-sm90a)

env:
  variables:
    ECR_REPO: "deepep-v2-efa-base"
    BASE_VERSION_TAG: "v0.1.2-sm90a"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
      - export ECR_REPO_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
      - export IMAGE_TAG="${BASE_VERSION_TAG}-amd64"
      - export COMMIT_SHA=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - echo "Building ${ECR_REPO_URI}:${IMAGE_TAG}"
      # Wave 7d-1 OKR-1: source canonical pins from pins.env at repo root so
      # the build-args stay in sync across the three consumer repos. The
      # Dockerfile retains hardcoded ARG defaults as fallback.
      - test -f pins.env || (echo "ERROR: pins.env missing at repo root" && exit 1)
      - . ./pins.env
      - echo "[pins] DEEPEP_FORK=${DEEPEP_FORK}"
      - echo "[pins] DEEPEP_BRANCH=${DEEPEP_BRANCH}"
      - echo "[pins] DEEPEP_SHA=${DEEPEP_SHA}"
      - echo "[pins] NVIDIA_NCCL_PIN=${NVIDIA_NCCL_PIN}"

  build:
    commands:
      - echo "Building Docker image..."
      - |
        docker build \
          --build-arg DEEPEP_FORK="${DEEPEP_FORK}" \
          --build-arg DEEPEP_BRANCH="${DEEPEP_BRANCH}" \
          --build-arg DEEPEP_SHA="${DEEPEP_SHA}" \
          --build-arg NVIDIA_NCCL_PIN="${NVIDIA_NCCL_PIN}" \
          -t "${ECR_REPO_URI}:${IMAGE_TAG}" .
      - docker tag ${ECR_REPO_URI}:${IMAGE_TAG} ${ECR_REPO_URI}:${COMMIT_SHA}

  post_build:
    commands:
      - echo "Running preflight checks..."
      - docker run --rm ${ECR_REPO_URI}:${IMAGE_TAG} bash /preflight.sh
      - |
        if [ $? -ne 0 ]; then
          echo "Preflight checks failed - image validation error"
          exit 1
        fi
      - echo "Preflight passed - pushing to ECR..."
      - docker push ${ECR_REPO_URI}:${IMAGE_TAG}
      - docker push ${ECR_REPO_URI}:${COMMIT_SHA}
      - echo "Successfully pushed ${ECR_REPO_URI}:${IMAGE_TAG}"
      - echo "Successfully pushed ${ECR_REPO_URI}:${COMMIT_SHA}"

artifacts:
  files: []
